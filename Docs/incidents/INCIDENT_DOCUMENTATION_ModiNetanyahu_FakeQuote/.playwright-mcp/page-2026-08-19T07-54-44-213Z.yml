            - paragraph [ref=f156e92]: AI Detector Tools Flag Manipulation
            - paragraph [ref=f156e93]: For further confirmation, we examined the videos using AI detection tool Deepfake-o-Meter, where multiple detection parameters flagged AI manipulation in the videos. We also tested the audio of the videos using the AI voice detection tool Hiya, which concluded that the voices are fake. This further confirmed that the videos do not feature original speeches by Modi and Netanyahu.
