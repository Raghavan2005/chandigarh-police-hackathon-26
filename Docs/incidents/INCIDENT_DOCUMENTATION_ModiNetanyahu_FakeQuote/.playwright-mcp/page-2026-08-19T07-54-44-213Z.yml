            - paragraph [ref=f156e49]: Several X handles shared digitally manipulated videos of Prime Ministers of India and Israel, Narendra Modi and Benjamin Netanyahu, claiming that the two leaders announced monetary assistance to Afghanistan.
            - paragraph [ref=f156e50]: The videos are being circulated after Pakistan announced an “open war” against Afghanistan following several days of escalating friction between the two neighboring nations.
            - paragraph [ref=f156e51]: BOOM found both the videos have been altered using AI. We also went through the original speeches delivered by Modi and Netanyahu at Israel’s parliament, the Knesset, but found no such announcement by them.
