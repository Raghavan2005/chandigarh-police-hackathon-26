                - paragraph [ref=f9e471]: Amid the reports about an alleged India-Israel defence pact, Israeli Prime Minister Benjamin Netanyahu said India and Israel would continue to strengthen their relationship.
                - paragraph [ref=f9e473]: Netanyahu made the remarks in a post on X while resharing Prime Minister Narendra Modi's post about a phone conversation between the two leaders on Thursday.
                - paragraph [ref=f9e475]: The conversation focused on strengthening the Special Strategic Partnership between India and Israel and discussing the situation in West Asia.
                - paragraph [ref=f9e477]: "\"Thank you, my friend, Prime Minister of India Narendra Modi. Together we continue to strengthen the bond between Israel and India,\" Netanyahu said."
                - paragraph [ref=f9e479]: PM Modi and Netanyahu spoke by phone on Thursday to review and further strengthen bilateral ties. The two leaders discussed deeper cooperation across several sectors and regional developments.
                - paragraph [ref=f9e481]: MEA spokesperson Randhir Jaiswal gave details of the conversation during the biweekly press briefing in New Delhi on Friday. Jaiswal said the Israeli side initiated the call and Prime Minister Modi received it.
