                  - paragraph [ref=f9e116]: The MEA has rejected as “fake news” reports that India sought a defence pact with Israel following the Pakistan, Saudi Arabia and Turkey security agreement, while New Delhi continues to closely monitor the trilateral pact.
              - generic [ref=f9e119]:
                - paragraph [ref=f9e121]: The Ministry of External Affairs (MEA) on Friday (August 07) rejected reports claiming that India had approached Israel for a defence pact in response to the newly formed Pakistan-Saudi Arabia-Turkey security framework.
                - generic [ref=f9e122]: advertisement
                - paragraph [ref=f9e126]: The claim first appeared in Turkish media outlet Straturka and later spread across social media. The report, citing unnamed Pakistani sources, claimed that New Delhi had started discussions with Tel Aviv for a defence agreement to counter the trilateral security arrangement.
                - paragraph [ref=f9e128]: The MEA Fact Check unit dismissed the report as fake news and shared a screenshot of the article on social media.
